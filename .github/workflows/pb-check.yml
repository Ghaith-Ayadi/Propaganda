# Shared PocketBase schema check, called by every app repo (docs/ci.md).
# An app repo's .github/workflows/pb.yml:
#   on: { pull_request: { paths: ["pb/**"] }, push: { branches: [main], paths: ["pb/**"] } }
#   jobs: { schema: { uses: Ghaith-Ayadi/Bedrock/.github/workflows/pb-check.yml@main } }
#
# Level 1  parse:   node --check on every pb/**/*.js
# Level 2  boot:    the PR's pb/ on an empty database with the production
#                   PocketBase version: migrations apply, hooks load, healthy
# Level 3  upgrade: the base branch's pb/, seeded with records, restarted on the
#                   PR's pb/: no record may be lost; changed values are listed
# Extra    pb/ci.sh in the app repo, if present (PB_BIN set), e.g. Propaganda's
#          rehearsal with its own seed data and rules suite.
# Everything runs on throwaway data on the runner; no secret is used.
name: pb-check

on:
  workflow_call:

permissions:
  contents: read

env:
  # Must equal the image tag in Bedrock's compose files; Bedrock CI enforces it.
  PB_VERSION: "0.40.4"

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0

      - name: Base branch pb/ (for the upgrade check)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          mkdir -p base
          if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] \
             && git -C app cat-file -e "$base:pb/pb_migrations" 2>/dev/null; then
            git -C app archive "$base" pb | tar -x -C base
            echo "base: $base"
          else
            echo "no pb/ on the base: the upgrade check is skipped"
          fi

      - name: "Level 1: parse"
        run: |
          set -e
          [ -d app/pb/pb_migrations ] || { echo "::error::no pb/pb_migrations in this repo"; exit 1; }
          n=0
          while IFS= read -r f; do node --check "$f"; n=$((n+1)); done < <(find app/pb -name '*.js' -not -path '*/node_modules/*')
          echo "parsed $n files"

      - name: PocketBase ${{ env.PB_VERSION }}
        run: |
          curl -fsSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v$PB_VERSION/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -oq pb.zip pocketbase && ./pocketbase --version

      - name: "Levels 2 and 3: boot and upgrade"
        run: |
          cat > pbcheck.py <<'PY'
          #!/usr/bin/env python3
          """PocketBase schema check for a Bedrock app (levels 2 and 3; level 1 is node --check).

            pbcheck.py --pb BIN --new PB_DIR [--base PB_DIR] [--work DIR]

          PB_DIR is an app's pb/ (pb_migrations + pb_hooks).
          Level 2 (boot): a fresh instance with --new must apply every migration, load
            every hook and answer /api/health, with no errors in its log.
          Level 3 (upgrade, when --base has pb/): a fresh instance on --base's schema is
            seeded with a few records per collection, then restarted on --new. Every
            seeded record must still exist afterwards; changed field values are listed
            (a backfill is fine, an unintended rewrite is worth seeing).
          Runs only on throwaway data under --work, on 127.0.0.1.
          """
          import argparse, json, re, os, shutil, signal, subprocess, sys, time, urllib.error, urllib.request

          PORT = 8097
          BASE = f"http://127.0.0.1:{PORT}"
          SU_EMAIL, SU_PASS = "ci@bedrock.invalid", "ci-Passw0rd-123456"
          # Same variables production sets, with dummy values: the bootstrap and hooks take
          # the same code paths as on the box, and no real secret ever reaches CI.
          ENV = {
              "PB_SUPERUSER_EMAIL": SU_EMAIL, "PB_SUPERUSER_PASSWORD": SU_PASS,
              "PB_ENCRYPTION_KEY": "ci0ci1ci2ci3ci4ci5ci6ci7ci8ci9ab",
              "PB_APP_NAME": "CI", "PB_APP_URL": "http://127.0.0.1",
              "PB_GOOGLE_CLIENT_ID": "ci.apps.googleusercontent.com", "PB_GOOGLE_CLIENT_SECRET": "ci",
              "PB_BACKUP_CRON": "0 3 * * *",
          }
          ERROR_MARKERS = ("level=ERROR", "\"level\":\"ERROR\"", "failed to apply", "Error: ", "panic:")


          def log(msg): print(msg, flush=True)


          class Instance:
              def __init__(self, pb, data, pbdir, logfile):
                  self.pb, self.data, self.pbdir, self.logfile = pb, data, pbdir, logfile
                  self.proc = None

              def start(self):
                  env = dict(os.environ, **ENV)
                  self.out = open(self.logfile, "w")
                  self.proc = subprocess.Popen(
                      [self.pb, "serve", "--dir", self.data, "--http", f"127.0.0.1:{PORT}",
                       "--migrationsDir", os.path.join(self.pbdir, "pb_migrations"),
                       "--hooksDir", os.path.join(self.pbdir, "pb_hooks"),
                       "--automigrate=false", "--encryptionEnv=PB_ENCRYPTION_KEY"],
                      stdout=self.out, stderr=subprocess.STDOUT, env=env)
                  for _ in range(60):
                      if self.proc.poll() is not None:
                          return self.fail(f"PocketBase exited with code {self.proc.returncode} during start")
                      try:
                          with urllib.request.urlopen(BASE + "/api/health", timeout=2) as r:
                              if r.status == 200:
                                  break
                      except Exception:
                          pass
                      time.sleep(0.5)
                  else:
                      return self.fail("no /api/health after 30s")
                  time.sleep(1)  # let hooks finish their onBootstrap/serve work
                  bad = [l for l in self.log_lines() if any(m in l for m in ERROR_MARKERS)]
                  if bad:
                      return self.fail("errors in the PocketBase log:\n  " + "\n  ".join(bad[:20]))
                  return True

              def log_lines(self):
                  self.out.flush()
                  with open(self.logfile) as f:
                      return f.read().splitlines()

              def fail(self, why):
                  log(f"::error::{why}")
                  log("---- PocketBase log ----")
                  for l in self.log_lines()[-60:]:
                      log("  " + l)
                  self.stop()
                  return False

              def stop(self):
                  if self.proc and self.proc.poll() is None:
                      self.proc.send_signal(signal.SIGTERM)
                      try:
                          self.proc.wait(10)
                      except subprocess.TimeoutExpired:
                          self.proc.kill()
                  self.proc = None


          def api(method, path, token=None, body=None):
              req = urllib.request.Request(BASE + path, method=method,
                                           data=json.dumps(body).encode() if body is not None else None,
                                           headers={"Content-Type": "application/json", **({"Authorization": token} if token else {})})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read() or b"{}")
                  except Exception:
                      return e.code, {}


          def login():
              s, r = api("POST", "/api/collections/_superusers/auth-with-password",
                         body={"identity": SU_EMAIL, "password": SU_PASS})
              if s != 200:
                  raise SystemExit(f"::error::superuser login failed ({s}): {r}")
              return r["token"]


          def collections(token):
              s, r = api("GET", "/api/collections?perPage=500", token)
              return [c for c in r.get("items", []) if not c.get("system") and c.get("type") in ("base", "auth")]


          def value_for(field, i, cname, seeded):
              t, name = field["type"], field["name"]
              if t == "text":
                  v = f"ci-{cname}-{name}-{i}"
                  pat = field.get("pattern") or ""
                  if pat:  # satisfy the field's own pattern if one of these shapes does
                      cands = [v, "2026-01-%02d" % (i + 1), "2026-01", f"ci{i}", f"ci-{i}", str(i + 1), "a" * (i + 3)]
                      v = next((c for c in cands if re.fullmatch(pat.strip("^$"), c)), v)
                  mx = field.get("max") or 0
                  return v[-mx:] if mx and len(v) > mx else v
              if t == "editor": return f"<p>ci {i}</p>"
              if t == "number": return max(field.get("min") or 0, 1) + i
              if t == "bool": return True
              if t == "email": return f"ci{i}.{name}@bedrock.invalid"
              if t == "url": return f"https://bedrock.invalid/{cname}/{i}"
              if t == "date": return "2026-01-0%d 00:00:00.000Z" % (i + 1)
              if t == "json": return {"ci": i}
              if t == "geoPoint": return {"lon": 0, "lat": 0}
              if t == "select":
                  vals = field.get("values") or []
                  if not vals: return None
                  return [vals[i % len(vals)]] if (field.get("maxSelect") or 1) > 1 else vals[i % len(vals)]
              if t == "relation":
                  pool = seeded.get(field.get("collectionId"), [])
                  if not pool: return "MISSING"
                  return [pool[i % len(pool)]] if (field.get("maxSelect") or 1) > 1 else pool[i % len(pool)]
              return None  # file, autodate, password handled elsewhere / skipped


          def seed(token, per=3):
              cols = collections(token)
              seeded, skipped = {}, {}
              for _ in range(4):  # a few passes so relations find their targets
                  progress = False
                  for c in cols:
                      if len(seeded.get(c["id"], [])) >= per:
                          continue
                      for i in range(len(seeded.get(c["id"], [])), per):
                          body, missing = {}, None
                          for f in c.get("fields", []):
                              if f["type"] == "password":
                                  body["password"] = body["passwordConfirm"] = "ci-Passw0rd-123456"; continue
                              if f.get("system") or f["type"] in ("autodate", "file"):
                                  if f.get("required") and f["type"] == "file": missing = f["name"]
                                  continue
                              v = value_for(f, i, c["name"], seeded)
                              if v == "MISSING":
                                  if f.get("required"): missing = f["name"]
                                  continue
                              if v is not None: body[f["name"]] = v
                          if c["type"] == "auth":
                              body["email"] = f"ci{i}.{c['name']}@bedrock.invalid"
                          if missing:
                              skipped[c["name"]] = f"required {missing} has nothing to point at yet"
                              break
                          s, r = api("POST", f"/api/collections/{c['id']}/records", token, body)
                          if s == 200:
                              seeded.setdefault(c["id"], []).append(r["id"]); progress = True
                              skipped.pop(c["name"], None)
                          else:
                              skipped[c["name"]] = f"{s} {json.dumps(r.get('data') or r.get('message'))[:200]}"
                              break
                  if not progress:
                      break
              names = {c["id"]: c["name"] for c in cols}
              for cid, ids in seeded.items():
                  log(f"  seeded {len(ids)} x {names[cid]}")
              for n, why in skipped.items():
                  log(f"  ::warning::could not seed {n}: {why}")
              return {names[cid]: ids for cid, ids in seeded.items()}


          def snapshot(token, seeded):
              out = {}
              for cname, ids in seeded.items():
                  for rid in ids:
                      s, r = api("GET", f"/api/collections/{cname}/records/{rid}", token)
                      out[f"{cname}/{rid}"] = r if s == 200 else None
              return out


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--pb", required=True)
              ap.add_argument("--new", required=True)
              ap.add_argument("--base")
              ap.add_argument("--work", default="/tmp/pbcheck")
              a = ap.parse_args()
              shutil.rmtree(a.work, ignore_errors=True); os.makedirs(a.work)

              log("== level 2: boot the PR's pb/ on an empty database")
              inst = Instance(a.pb, f"{a.work}/fresh", a.new, f"{a.work}/fresh.log")
              if not inst.start(): return 1
              names = [c["name"] for c in collections(login())]
              inst.stop()
              log(f"  ok: migrations applied, hooks loaded, healthy; collections: {', '.join(names)}")

              if not a.base or not os.path.isdir(os.path.join(a.base, "pb_migrations")):
                  log("== level 3: skipped (no pb/ on the base branch)")
                  return 0
              log("== level 3: upgrade from the base branch's pb/ with data in it")
              data = f"{a.work}/upgrade"
              old = Instance(a.pb, data, a.base, f"{a.work}/base.log")
              if not old.start(): return 1
              tok = login()
              seeded = seed(tok)
              if not seeded:
                  old.stop()
                  log("::error::level 3 could not seed a single record, so it would prove nothing; see the warnings above")
                  return 1
              before = snapshot(tok, seeded)
              old.stop()
              new = Instance(a.pb, data, a.new, f"{a.work}/upgrade.log")
              if not new.start(): return 1
              after = snapshot(login(), seeded)
              new.stop()
              lost = [k for k, v in after.items() if v is None]
              changed = []
              for k, v in before.items():
                  if after.get(k) is None: continue
                  diff = sorted(f for f in set(v) | set(after[k]) if f != "updated" and v.get(f) != after[k].get(f))
                  if diff: changed.append(f"{k}: {', '.join(diff)}")
                  if v.get("updated") != after[k].get("updated"): changed.append(f"{k}: updated timestamp bumped")
              if lost:
                  log("::error::records lost in the upgrade:\n  " + "\n  ".join(lost)); return 1
              for c in changed:
                  log(f"  ::notice::changed by the upgrade: {c}")
              log(f"  ok: {len(before)} seeded records all survived the upgrade ({len(changed)} changes listed)")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
          python3 pbcheck.py --pb "$PWD/pocketbase" --new app/pb --base base/pb --work "$RUNNER_TEMP/pbcheck"

      - name: App's own check (pb/ci.sh)
        if: hashFiles('app/pb/ci.sh') != ''
        env:
          PB_BIN: ${{ github.workspace }}/pocketbase
        run: bash app/pb/ci.sh
