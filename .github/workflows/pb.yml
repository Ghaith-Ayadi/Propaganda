# Schema check on every change to pb/: Bedrock's shared pb-check, copied here
# (pb-check.yml) because a public repo can't call a private repo's workflow;
# Bedrock CI fails if this copy drifts from its original. (parse, boot,
# upgrade from the base branch), then pb/ci.sh (the rehearsal). See Bedrock docs/ci.md.
name: pb
on:
  pull_request: { paths: ["pb/**", ".github/workflows/pb.yml", ".github/workflows/pb-check.yml"] }
  push: { branches: [main], paths: ["pb/**", ".github/workflows/pb.yml", ".github/workflows/pb-check.yml"] }
jobs:
  schema:
    uses: ./.github/workflows/pb-check.yml
