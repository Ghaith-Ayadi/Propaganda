# The knowledge base's SQL (supabase/migrations, the kb_ and agent functions):
# every migration on a fresh Postgres with pgvector, then supabase/tests/kb/test.sql.
name: kb
on:
  workflow_call: # the release run (release.yml)
  pull_request:
    paths: ["supabase/migrations/**", "supabase/tests/kb/**", ".github/workflows/kb.yml"]
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "supabase/tests/kb/**", ".github/workflows/kb.yml"]
jobs:
  kb:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/kb/run.sh
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
