name: deploy-app
# Ships the app (app/ and api/) to Vercel production. Vercel's Git integration is off for
# this project, so pushes and PRs never create Vercel deployments; this run is the only way
# to production. Started by hand on main, and only on Ayadi's word.
on:
  workflow_dispatch:
concurrency: { group: deploy-app, cancel-in-progress: false }
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
