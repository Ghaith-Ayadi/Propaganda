name: deploy-app
# Ships the app (app/ and api/) to Vercel production. Vercel's Git integration is off for
# this project, so pushes and PRs never create Vercel deployments; this run is the only way
# to production. Started by the release run (release.yml) once its tests pass, or by hand on
# main; either only on Ayadi's word. A hotfix release deploys from its hotfix/ branch.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      VERCEL_TOKEN: { required: true }
      VERCEL_ORG_ID: { required: true }
      VERCEL_PROJECT_ID: { required: true }
concurrency: { group: deploy-app, cancel-in-progress: false }
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hotfix/')
    runs-on: ubuntu-latest
    env:
      # The CLI reads these from the environment; nothing goes on a command line.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Git deploys used to set this; the build reads it for /version. The functions get the sha
      # as APP_COMMIT_SHA (Vercel reserves VERCEL_* names), read by api/_telemetry.ts.
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      # The plan checks (release.yml) are what make a hotfix branch safe to ship, and the release
      # run tags the commit only after they pass: a hand-run deploy of a hotfix branch has no tag.
      - name: A hotfix branch deploys only a commit a release run tagged
        if: startsWith(github.ref, 'refs/heads/hotfix/')
        run: |
          git fetch --tags -q origin
          git tag --points-at HEAD | grep -qx 'v[0-9]\+\.[0-9]\+\.[0-9]\+' \
            || { echo "::error::This commit has no release tag: a hotfix is deployed by the release workflow, never by hand"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --global vercel@63.1.2
      - run: vercel pull --yes --environment=production
      - run: vercel build --prod
      - run: vercel deploy --prebuilt --prod --env APP_COMMIT_SHA=${{ github.sha }}
