# Nothing in Propaganda is heavier than 600 (Ayadi, 2026-10-15). Fails a PR that
# brings a font weight above it into the app's source. Also runs the app's own
# unit tests (node's runner on the pure modules, no install needed).
name: font-weights
on:
  pull_request:
    paths: ["app/**", ".github/workflows/font-weights.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/font-weights.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node app/scripts/check-font-weights.mjs
      - run: npm test
        working-directory: app
